<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Vote Search</title>
</head>

<body>
    <main>
        <h1>Vote Search</h1>
        <div>
            <a href="../index.html">Home Page</a>
        </div>

        <section>
            <details>
                <summary>Levi please explain wtf this page is and how to use it</summary>
                Alright so basically
            </details>
        </section>

        <section>
            Options:
            <div>
                <label for="scopeInput">Narrow the search</label>
                <input type="text" id="scopeInput">
            </div>
            <div>
                <label for="minPostsInput">Minimum posts</label>
                <input type="text" id="minPostsInput">
            </div>
            <div>
                <label for="maxPostsInput">Maximum posts</label>
                <input type="text" id="maxPostsInput">
            </div>


            <div>
                <button id="refreshButton" class="danger-btn">Refresh</button>
            </div>
        </section>

        <section>
            Rate Selected Post:
            <div>
                <button id="rateMinusOne">-1</button>
                <button id="rateZero">0</button>
                <button id="ratePlusOne">+1</button>
            </div>
        </section>

        <section>
            Selected post: <span id="rateSpan"></span>
            <div id="currentImageDiv"></div>
        </section>

        <details>
            <summary>Rated posts</summary>
            <div id="summaryDiv"></div>
        </details>

        <section>
            Search prompt:
            <div id="promptDisplayDiv">[currently no prompt]</div>
        </section>

        <section>
            Search: <span id="searchPageNumberDisplaySpan"></span>
            <div>
                <button id="searchPrev" class="danger-btn">Previous page</button>
                <button id="searchNext" class="danger-btn">Next page</button>
            </div>
            <div id="searchPostDisplay"></div>
        </section>
    </main>
</body>

<script type="module" async="true" src="../src/voteSearch.js"></script>

</html>
