<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../style.css">
    <title>Mass Sort</title>
</head>

<body>
    <main>
        <h1>Mass Sort</h1>
        <div>
            <a href="../../../index.html">Home Page</a>
        </div>
        <section>
            <div>
                <label for="modeSelect">Select post rating mode:</label>
                <select id="modeSelect">
                    <option value="l1">Level 1</option>
                    <option value="l2">Level 2</option>
                </select>
            </div>
            <div>
                <label for="bufferSelect">Select buffer type:</label>
                <select id="bufferSelect">
                    <option value="plusOne">+1/+2</option>
                    <option value="relative">relative</option>
                </select>
            </div>
            <div>
                <label for="poolSizeInput">Pool size:</label>
                <input type="text" id="poolSizeInput">
            </div>
            <div>
                <label for="literalSearch">Literal search</label>
                <input type="text" id="literalSearch">
                <span id="litSearchCountDisp"></span>
            </div>
            <div>
                <label for="tagToRateBy">Sort by</label>
                <input type="text" id="tagToRateBy">
                <!-- <span id="sortForCountDisp"></span> -->
            </div>
            <div>
                <button id="initButton">Initialize</button>
                <span id="initStatusDisplay">Not yet initialized</span>
            </div>
            <div>
                <button id="goButton" class="danger-btn">Go</button>
                <span>multiplied by</span>
                <input type="text" id="amtStepsInput">
                <span id="pendingStepsDisplay"></span>
            </div>
        </section>
        <section class="wide-content">
            <span id="postDisplay"></span>
        </section>
    </main>
</body>

<script type="module" async="true" src="./mass_sort.js"></script>

</html>
