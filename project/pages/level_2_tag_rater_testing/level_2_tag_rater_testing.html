<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../style.css">
    <title>Level 2 Tag Rater Testing</title>
</head>

<body>
    <main>
        <h1>Level 2 Tag Rater Testing</h1>
        <div>
            <a href="../../../index.html">Home Page</a>
        </div>

        <section>
            <div>
                <label for="tagToRateBy">Tag to rate by:</label>
                <input type="text" id="tagToRateBy">
            </div>
            <div>
                <label for="ttrCensusSize">Size of census of tag to rate:</label>
                <input type="text" id="ttrCensusSize">
            </div>
            <div>
                <label for="formulaFirstTerm">Include first term in formula?</label>
                <input type="checkbox" checked="true" id="formulaFirstTerm">
            </div>
            <button id="createRaterButton">Create Rater</button>
            <div>
                <label for="tagToRate">Tag to rate:</label>
                <input type="text" id="tagToRate">
            </div>
            <button id="rateButton">Rate</button>
        </section>
        <section>
            <div id="answerDiv"></div>
        </section>
    </main>
</body>

<script type="module" async="true" src="./level_2_tag_rater_testing.js"></script>

</html>
